<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VoxShield Check settings</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; color: #1a1a1a; max-width: 560px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { color: #475467; margin: 0 0 20px; }
      label { display: block; font-weight: 600; margin-top: 16px; }
      small { display: block; font-weight: 400; color: #667085; }
      input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 8px 10px; font: inherit; border: 1px solid #d0d5dd; border-radius: 8px; }
      button { margin-top: 20px; padding: 8px 16px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: #1a1a1a; color: #fff; cursor: pointer; }
      button.secondary { background: #f2f4f7; color: #1a1a1a; margin-left: 8px; }
      #status { margin-left: 12px; color: #067647; }
      #status.error { color: #b42318; }
      .note { margin-top: 28px; padding-top: 16px; border-top: 1px solid #eee; font-size: 13px; color: #667085; }
    </style>
  </head>
  <body>
    <h1>VoxShield Check</h1>
    <p>Check suspicious media where you find it, before you act on it. Get a verdict, the evidence behind it, and what the result cannot tell you.</p>

    <form id="form">
      <label>
        Backend URL
        <small>Where the analysis runs. The default is the local VoxShield server.</small>
        <input id="backendUrl" type="url" required placeholder="http://localhost:8000" />
      </label>
      <label>
        Website URL
        <small>Where "View full report" and History open.</small>
        <input id="siteUrl" type="url" required placeholder="http://localhost:5173" />
      </label>
      <button type="submit">Save</button>
      <button type="button" class="secondary" id="test">Test backend</button>
      <span id="status" role="status"></span>
    </form>

    <p class="note">The selected media is sent to your VoxShield backend for analysis. Files are not stored; only scores and reasons are kept.</p>
    <script type="module" src="options.js"></script>
  </body>
</html>
