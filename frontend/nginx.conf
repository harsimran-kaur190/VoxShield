# Live calls use a WebSocket under /api/v1/calls/: pass the upgrade through, and close normally otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A little above the backend's 25 MB upload limit; the backend enforces the real limit.
  client_max_body_size 30m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  # The microphone is needed by Record audio, and only for this site.
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the backend trusts this header, and a client-supplied X-Forwarded-For must not reach it.
    # If another proxy or load balancer sits in front of this one, configure nginx's realip module instead.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The analysis streams progress as it goes, so responses must not be buffered. Long recordings take minutes.
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # Live Call Protection: WebRTC signaling and the analysed call audio. Calls can last an hour; the browser pings every 20 s.
  location /api/v1/calls/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  }
}
